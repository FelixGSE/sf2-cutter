# Git hooks, run by prek (https://prek.j178.dev — pre-commit compatible).
# Install into .git/hooks with: prek install
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: dprint
        name: dprint check
        entry: dprint check
        language: system
        files: '\.(toml|md|ya?ml)$|Dockerfile'
        pass_filenames: false
      - id: hadolint
        name: hadolint
        entry: hadolint .devcontainer/Dockerfile
        language: system
        files: 'Dockerfile'
        pass_filenames: false
