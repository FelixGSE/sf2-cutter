[package]
name = "sf2-cutter"
version = "0.1.0"
edition = "2024"
# as_chunks and let-chains require 1.88
rust-version = "1.88"
description = "Extract a subset of presets from a SoundFont (.sf2) file into a new, smaller .sf2"
license = "MIT"
repository = "https://github.com/FelixGSE/sf2-cutter"
readme = "README.md"
keywords = ["soundfont", "sf2", "midi", "audio", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
# Keep the crates.io tarball to what a consumer needs.
include = ["src/**", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dialoguer = "0.12.0"
lewton = { version = "0.10.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[features]
default = ["sf3"]
# Read support for SF3 (MuseScore-style Ogg-Vorbis-compressed) fonts;
# extraction decodes kept samples to PCM and emits plain sf2.
sf3 = ["dep:lewton"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
proptest = "1.11.0"
