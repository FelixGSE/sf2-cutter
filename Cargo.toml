[package]
name = "sf2-cutter"
version = "0.1.0"
categories = ["command-line-utilities", "multimedia::audio"]
edition = "2024"
# Keep the crates.io tarball to what a consumer needs.
include = ["src/**", "Cargo.toml", "LICENSE", "README.md"]
keywords = ["soundfont", "sf2", "midi", "audio", "cli"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/FelixGSE/sf2-cutter"
# as_chunks and let-chains require 1.88
rust-version = "1.88"
description = "Extract a subset of presets from a SoundFont (.sf2) file into a new, smaller .sf2"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dialoguer = "0.12.0"
lewton = { version = "0.10.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
vorbis_rs = { version = "0.5.6", optional = true }

[features]
default = ["sf3"]
# Read support for SF3 (MuseScore-style Ogg-Vorbis-compressed) fonts;
# extraction decodes kept samples to PCM and emits plain sf2.
sf3 = ["dep:lewton"]
# Write support for SF3: encodes samples with the vendored aoTuV/libvorbis
# encoder (C, via vorbis_rs). Off by default to keep the default build pure Rust.
sf3-write = ["sf3", "dep:vorbis_rs"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
proptest = "1.11.0"
