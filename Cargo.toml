[package]
name = "sf2-cutter"
version = "0.1.0"
edition = "2024"
description = "Extract a subset of presets from a SoundFont (.sf2) file into a new, smaller .sf2"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
unwrap_used = "warn"
expect_used = "warn"
