[package]
name = "sf2-cutter-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sf2-cutter = { path = ".." }

# Standalone workspace so the fuzz crate (nightly-only) stays out of the
# parent crate's builds, lints, coverage, and mutation runs.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
