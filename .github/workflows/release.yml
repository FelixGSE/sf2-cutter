name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  upload-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sf2-cutter
          target: ${{ matrix.target }}
          features: sf3-write
          # Attach <asset>.sha256 files alongside each archive
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
