name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The upload action only attaches assets to an existing release. release-plz
  # creates one when it tags; for a hand-pushed tag, create it here from the
  # matching CHANGELOG section.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release unless it already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: fully static Linux binaries that run on any distribution
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sf2-cutter
          target: ${{ matrix.target }}
          features: sf3-write
          # Attach <asset>.sha256 files alongside each archive
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
