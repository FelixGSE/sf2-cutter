name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Install fluidsynth (soundfont smoke test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Tests without default features (sf3 off)
        run: cargo test --no-default-features
      - name: Tests with all features (sf3 encoder on)
        run: cargo test --all-features
      - name: Documentation lints
        run: RUSTDOCFLAGS="-D warnings -D rustdoc::all" cargo doc --no-deps --all-features
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage floor
        run: make coverage
        env:
          COVERAGE_MIN: "80"

  # Builds every release target exactly as release.yml does (including the
  # vendored C Vorbis encoder), so a broken target fails here instead of at
  # tag time.
  release-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: houseabsolute/actions-rust-cross@v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked --features sf3-write"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Check on MSRV
        run: cargo check --all-features --all-targets

  lint-aux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (devcontainer image)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile
      - name: dprint check
        uses: dprint/check@v2.2

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository (vulnerabilities, secrets, misconfigurations)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Mutation testing is too slow for the PR gate; run on demand.
  mutants:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - name: Mutation tests
        run: cargo mutants

  # Time-boxed fuzzing; run on demand.
  fuzz:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz parse
        run: cargo +nightly fuzz run parse -- -max_total_time=120
      - name: Fuzz roundtrip
        run: cargo +nightly fuzz run roundtrip -- -max_total_time=120
